name: Publish Debug APK

on:
  push:
    branches: [ main ]

concurrency:
  group: publish-debug-apk-main
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  publish:
    name: Build and publish debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36 build-tools;36.0.0"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Set monotonic app version
        run: |
          version_epoch_base=1704067200
          version_code="$(($(date +%s) - version_epoch_base))"
          echo "VERSION_CODE=$version_code" >> "$GITHUB_ENV"
          echo "VERSION_NAME=0.1.$version_code" >> "$GITHUB_ENV"

      - name: Build debug APK
        env:
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Rename APK
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk artifacts/gunsout-debug.apk

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: gunsout-debug-apk
          path: artifacts/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Check latest release freshness
        run: |
          current_sha="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [ -z "$current_sha" ]; then
            echo "Could not determine current origin/main SHA." >&2
            exit 1
          fi

          if [ "$GITHUB_SHA" = "$current_sha" ]; then
            echo "PUBLISH_LATEST=true" >> "$GITHUB_ENV"
          else
            echo "PUBLISH_LATEST=false" >> "$GITHUB_ENV"
            echo "Skipping latest release because origin/main is now $current_sha."
          fi

      - name: Publish to "latest" release
        if: env.PUBLISH_LATEST == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Latest debug build"
          body: |
            Latest debug-signed APK built from `main`.

            Commit: ${{ github.sha }}
            Workflow: ${{ github.run_id }}

            Install via Android sideload (settings, install unknown apps).
          files: artifacts/*.apk
          overwrite_files: true
          prerelease: true
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
